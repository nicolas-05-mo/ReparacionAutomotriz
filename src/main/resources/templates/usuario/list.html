<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(${title}, 'usuarios', ~{::div.page-content})}">
<body>
<div class="page-content">
    <header class="page-header">
        <div>
            <p class="eyebrow">Administración</p>
            <h1 class="page-title" th:text="${title}">Usuarios</h1>
        </div>
        <a th:href="@{/usuarios/new}" class="welcome-cta"><i class="bi bi-plus-circle"></i> Nuevo usuario</a>
    </header>

    <section class="table-section">
        <table class="loans-table">
            <thead>
            <tr><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.nombre + ' ' + u.apellido}">Nombre</td>
                <td th:text="${u.email}">correo</td>
                <td th:text="${u.telefono}">Teléfono</td>
                <td th:text="${u.rol.rol}">Rol</td>
                <td>
                    <span th:if="${u.estadoUsu}" class="badge badge-success">Activo</span>
                    <span th:unless="${u.estadoUsu}" class="badge badge-neutral">Dado de baja</span>
                </td>
                <td>
                    <div class="row-actions">
                        <a th:href="@{/usuarios/{id}/edit(id=${u.idUsuario})}" class="action-link" title="Editar"><i class="bi bi-pencil"></i></a>
                        <form th:action="@{/usuarios/{id}/state(id=${u.idUsuario})}" method="post" class="inline-form">
                            <button type="submit" class="action-link"
                                    th:classappend="${u.estadoUsu} ? 'action-link--danger' : 'action-link--success'"
                                    th:title="${u.estadoUsu} ? 'Dar de baja' : 'Reactivar'">
                                <i class="bi" th:classappend="${u.estadoUsu} ? 'bi-slash-circle' : 'bi-arrow-counterclockwise'"></i>
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</div>
</body>
</html>
