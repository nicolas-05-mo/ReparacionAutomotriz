<!DOCTYPE html>
<html lang="es" th:lang="#{lang.code}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title} + ' - ' + #{app.name}">Login</title>
    <script>
        (function () {
            var KEY = 'taller-theme';
            var saved = null;
            try { saved = localStorage.getItem(KEY); } catch (e) {}
            var prefersDark = false;
            try { prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
            document.documentElement.setAttribute('data-theme', saved ? saved : (prefersDark ? 'dark' : 'light'));

            function paint() {
                var btn = document.getElementById('theme-toggle');
                if (!btn) { return; }
                var dark = document.documentElement.getAttribute('data-theme') === 'dark';
                btn.querySelector('i').className = 'bi ' + (dark ? 'bi-sun' : 'bi-moon-stars');
                btn.querySelector('span').textContent = dark ? btn.getAttribute('data-light') : btn.getAttribute('data-dark');
            }
            window.toggleTheme = function () {
                var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                try { localStorage.setItem(KEY, next); } catch (e) {}
                paint();
            };
            document.addEventListener('DOMContentLoaded', paint);
        })();
    </script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<div class="login-controls">
    <a href="?lang=es" class="lang-btn" th:classappend="${#messages.msg('lang.code') == 'es'} ? 'active'">ES</a>
    <a href="?lang=en" class="lang-btn" th:classappend="${#messages.msg('lang.code') == 'en'} ? 'active'">EN</a>
    <button type="button" id="theme-toggle" onclick="toggleTheme()" th:attr="data-dark=#{theme.dark},data-light=#{theme.light}" class="side-btn login-theme" aria-label="Theme">
        <i class="bi bi-moon-stars"></i><span th:text="#{theme.dark}">Modo oscuro</span>
    </button>
</div>

<div class="login-page">
    <section class="table-section login-card">
        <p class="eyebrow" th:text="#{home.eyebrow}">x</p>
        <h1 class="page-title" style="margin-bottom:20px" th:text="#{login.title}">x</h1>

        <div th:if="${param.error}" class="alert alert-danger" th:text="#{login.error}">x</div>
        <div th:if="${param.logout}" class="alert alert-success" th:text="#{login.logout}">x</div>

        <form th:action="@{/login}" method="post" class="crud-form">
            <div class="form-group">
                <label for="username" th:text="#{login.email}">x</label>
                <input type="email" id="username" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label for="password" th:text="#{login.password}">x</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="welcome-cta"><i class="bi bi-box-arrow-in-right"></i> <span th:text="#{login.submit}">x</span></button>
        </form>
    </section>
</div>
</body>
</html>
