<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(${title}, 'reparaciones', ~{::div.page-content})}">
<body>
<div class="page-content">
    <header class="page-header">
        <div>
            <p class="eyebrow" th:text="#{eyebrow.manage}">x</p>
            <h1 class="page-title" th:text="#{${title}}">Title</h1>
        </div>
        <a th:href="@{/reparaciones/new}" class="welcome-cta"><i class="bi bi-plus-circle"></i> <span th:text="#{repair.new}">x</span></a>
    </header>

    <section class="table-section">
        <table class="loans-table">
            <thead>
            <tr>
                <th th:text="#{repair.date}">x</th>
                <th th:text="#{repair.vehicle}">x</th>
                <th th:text="#{repair.typeShort}">x</th>
                <th th:text="#{repair.mechanicShort}">x</th>
                <th th:text="#{common.status}">x</th>
                <th th:text="#{common.actions}">x</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(reparaciones)}"><td colspan="6" class="empty-row" th:text="#{repair.empty}">x</td></tr>
            <tr th:each="r : ${reparaciones}">
                <td th:text="${r.fecha}">2026-11-13</td>
                <td th:text="${r.vehiculo.placa}">ABC-123</td>
                <td th:text="#{'enum.tipo.' + ${r.tipo.name()}}">Tipo</td>
                <td th:text="${r.mecanico.nombre + ' ' + r.mecanico.apellido}">Mecánico</td>
                <td>
                    <span th:if="${r.estado.name() == 'EN_PROCESO'}" class="badge badge-warning" th:text="#{repair.status.inprocess}">x</span>
                    <span th:if="${r.estado.name() == 'TERMINADO'}" class="badge badge-success" th:text="#{repair.status.done}">x</span>
                    <span th:if="${r.estado.name() == 'CANCELADO'}" class="badge badge-neutral" th:text="#{repair.status.cancelled}">x</span>
                </td>
                <td>
                    <div class="row-actions">
                        <a th:href="@{/reparaciones/{id}(id=${r.idReparacion})}" class="action-link" th:title="#{common.view}"><i class="bi bi-eye"></i></a>
                        <th:block th:if="${r.estado.name() == 'EN_PROCESO'}">
                            <a th:href="@{/reparaciones/{id}/edit(id=${r.idReparacion})}" class="action-link" th:title="#{common.edit}"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/reparaciones/{id}/estado(id=${r.idReparacion})}" method="post" class="inline-form">
                                <input type="hidden" name="estado" value="TERMINADO">
                                <button type="submit" class="action-link action-link--success" th:title="#{repair.finish}"><i class="bi bi-check-circle"></i></button>
                            </form>
                            <form th:action="@{/reparaciones/{id}/estado(id=${r.idReparacion})}" method="post" class="inline-form">
                                <input type="hidden" name="estado" value="CANCELADO">
                                <button type="submit" class="action-link action-link--danger" th:title="#{repair.cancel}"><i class="bi bi-x-circle"></i></button>
                            </form>
                        </th:block>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</div>
</body>
</html>
