<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout :: layout(${title}, 'reparaciones', ~{::div.page-content})}">
<body>
<div class="page-content">
    <header class="page-header">
        <div>
            <p class="eyebrow" th:text="#{eyebrow.manage}">x</p>
            <h1 class="page-title" th:text="#{${title}}">Formulario</h1>
        </div>
        <a th:href="@{/reparaciones}" class="btn-secondary"><i class="bi bi-arrow-left"></i> <span th:text="#{common.back}">x</span></a>
    </header>

    <section class="table-section">
        <form th:action="@{${formAction}}" th:object="${reparacion}" method="post" class="crud-form">
            <div class="alert alert-danger" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>

            <div class="form-row">
                <div class="form-group">
                    <label for="fecha" th:text="#{repair.date}">x</label>
                    <input type="date" id="fecha" th:field="*{fecha}">
                    <small class="field-error" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></small>
                </div>
                <div class="form-group">
                    <label for="tipo" th:text="#{repair.type}">x</label>
                    <select id="tipo" th:field="*{tipo}">
                        <option value="" th:text="#{common.select}">Seleccione</option>
                        <option th:each="t : ${tipos}" th:value="${t}" th:text="#{'enum.tipo.' + ${t.name()}}">Tipo</option>
                    </select>
                    <small class="field-error" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></small>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group form-group--wide">
                    <label for="vehiculo" th:text="#{repair.vehicle}">x</label>
                    <select id="vehiculo" name="vehiculo">
                        <option value="" th:text="#{repair.selectVehicle}">x</option>
                        <option th:each="v : ${vehiculosOpciones}" th:value="${v.idVehiculo}"
                                th:text="${v.placa + ' - ' + v.modelo.marca + ' ' + v.modelo.nombreModelo}"
                                th:selected="${reparacion.vehiculo != null and reparacion.vehiculo.idVehiculo == v.idVehiculo}">Vehículo</option>
                    </select>
                    <small class="field-error" th:if="${#fields.hasErrors('vehiculo')}" th:errors="*{vehiculo}"></small>
                </div>

                <div class="form-group" th:if="${esAdmin}">
                    <label for="mecanico" th:text="#{repair.mechanic}">x</label>
                    <select id="mecanico" name="mecanico">
                        <option value="" th:text="#{repair.selectMechanic}">x</option>
                        <option th:each="u : ${mecanicosOpciones}" th:value="${u.idUsuario}"
                                th:text="${u.nombre + ' ' + u.apellido}"
                                th:selected="${reparacion.mecanico != null and reparacion.mecanico.idUsuario == u.idUsuario}">Mecánico</option>
                    </select>
                    <small class="field-error" th:if="${#fields.hasErrors('mecanico')}" th:errors="*{mecanico}"></small>
                </div>
                <input type="hidden" name="mecanico" th:unless="${esAdmin}" th:value="${mecanicoActual.idUsuario}">
            </div>

            <div class="form-group">
                <label for="observaciones" th:text="#{repair.notes}">x</label>
                <textarea id="observaciones" th:field="*{observaciones}" rows="3" maxlength="500"></textarea>
                <small class="field-error" th:if="${#fields.hasErrors('observaciones')}" th:errors="*{observaciones}"></small>
            </div>

            <div class="form-actions">
                <a th:href="@{/reparaciones}" class="btn-secondary" th:text="#{common.cancel}">x</a>
                <button type="submit" class="welcome-cta"><i class="bi bi-check-circle"></i> <span th:text="#{common.save}">x</span></button>
            </div>
        </form>
    </section>
</div>
</body>
</html>
